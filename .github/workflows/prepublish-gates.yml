name: Prepublish Gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore No2SQL.sln

      - name: Build Release
        run: dotnet build No2SQL.sln -c Release --no-restore

      - name: Scan vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list No2SQL.sln package --vulnerable --include-transitive | tee vulnerable.txt

          # Temporary exception for SharpCompress advisory GHSA-6c8g-7p36-r338.
          # Tracking reference: TODO: replace with the concrete issue/PR URL that owns this exception.
          # Removal trigger: delete this allowlist entry once No2SQL depends on a SharpCompress
          # version that no longer reports GHSA-6c8g-7p36-r338 in `dotnet list package --vulnerable`.
          ALLOWED_ADVISORY="GHSA-6c8g-7p36-r338"
          ALLOWED_ADVISORY_REMOVAL_CONDITION="Remove when SharpCompress is upgraded past the vulnerable range and this GHSA no longer appears in the vulnerability report."

          has_markers=false
          if grep -qiE 'Severity|Advisory URL' vulnerable.txt; then
            has_markers=true
          fi

          # Collect unique advisory IDs from the report (if any).
          mapfile -t advisories < <(grep -Eo 'GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}' vulnerable.txt | sort -u || true)

          # Collect advisory URLs from the full report so non-GHSA advisories are enforced
          # even when `dotnet list ... --vulnerable` prints URLs on package rows rather than
          # on the "Advisory URL" header line.
          mapfile -t advisory_urls < <(grep -Eio 'https?://[^[:space:]]+' vulnerable.txt | sed 's/[),.;:]$//' | sort -u || true)

          blocking=()
          for advisory in "${advisories[@]}"; do
            if [[ "$advisory" != "$ALLOWED_ADVISORY" ]]; then
              blocking+=("$advisory")
            fi
          done

          blocking_urls=()
          for url in "${advisory_urls[@]}"; do
            if [[ "$url" != *"$ALLOWED_ADVISORY"* ]]; then
              blocking_urls+=("$url")
            fi
          done

          if (( ${#blocking[@]} > 0 )); then
            echo "Blocking advisories detected: ${blocking[*]}"
            exit 1
          fi

          if (( ${#blocking_urls[@]} > 0 )); then
            echo "Blocking advisory URLs detected: ${blocking_urls[*]}"
            exit 1
          fi

          # Defensive fallback: markers indicate vulnerabilities, but no parseable IDs/URLs were found.
          if [[ "$has_markers" == true ]] && (( ${#advisories[@]} == 0 )) && (( ${#advisory_urls[@]} == 0 )); then
            echo "Vulnerability markers detected but no advisory IDs/URLs were parsed. Failing gate defensively."
            exit 1
          fi

          if (( ${#advisories[@]} > 0 )) || (( ${#advisory_urls[@]} > 0 )); then
            echo "Only allowed advisories found (${ALLOWED_ADVISORY}); passing gate."
          else
            echo "No vulnerable packages detected."
          fi

      - name: Report outdated packages (informational)
        shell: bash
        run: dotnet list No2SQL.sln package --outdated --include-transitive | tee outdated.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MCP NuGet artifacts
        run: dotnet pack No2SQL/No2SQL.csproj -c Release -o artifacts/pack

      - name: Verify packages contain no pdb files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/pack/*.nupkg; do
            echo "Checking $pkg"
            if unzip -l "$pkg" | grep -Ei "\\.pdb$"; then
              echo "PDB file detected in $pkg"
              exit 1
            fi
          done

      - name: Verify MCP manifest in main package
        shell: bash
        run: |
          set -euo pipefail
          MAIN_PKG="artifacts/pack/No2SQL.1.0.0.nupkg"
          unzip -l "$MAIN_PKG" | grep -F ".mcp/server.json"

      - name: Upload packed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: no2sql-packages
          path: artifacts/pack/*.nupkg
