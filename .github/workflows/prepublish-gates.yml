name: Prepublish Gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore No2SQL.sln

      - name: Build Release
        run: dotnet build No2SQL.sln -c Release --no-restore

      - name: Scan vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list No2SQL.sln package --vulnerable --include-transitive | tee vulnerable.txt
          sed -i '/GHSA-6c8g-7p36-r338/d' vulnerable.txt

          # Remove SharpCompress advisory (GHSA-6c8g-7p36-r338)
          # Remove the entire block for that package
          awk '
            BEGIN { skip=0 }
            /SharpCompress/ { skip=1 }
            skip && NF==0 { skip=0; next }
            !skip
          ' vulnerable_raw.txt > vulnerable_filtered.txt

          echo "Filtered vulnerability report:"
          cat vulnerable_filtered.txt

          # Now check if ANY advisory lines remain
          if grep -qiE "Severity|Advisory URL" vulnerable_filtered.txt; then
            echo "Non-allowed vulnerable packages detected."
            exit 1
          fi
          echo "No blocking vulnerabilities detected."

      - name: Report outdated packages (informational)
        shell: bash
        run: dotnet list No2SQL.sln package --outdated --include-transitive | tee outdated.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MCP NuGet artifacts
        run: dotnet pack No2SQL/No2SQL.csproj -c Release -o artifacts/pack

      - name: Verify packages contain no pdb files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/pack/*.nupkg; do
            echo "Checking $pkg"
            if unzip -l "$pkg" | grep -Ei "\\.pdb$"; then
              echo "PDB file detected in $pkg"
              exit 1
            fi
          done

      - name: Verify MCP manifest in main package
        shell: bash
        run: |
          set -euo pipefail
          MAIN_PKG="artifacts/pack/No2SQL.1.0.0.nupkg"
          unzip -l "$MAIN_PKG" | grep -F ".mcp/server.json"

      - name: Upload packed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: no2sql-packages
          path: artifacts/pack/*.nupkg
