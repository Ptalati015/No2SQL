name: Prepublish Gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore No2SQL.sln

      - name: Build Release
        run: dotnet build No2SQL.sln -c Release --no-restore
        
        
      - name: Scan vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list No2SQL.sln package --vulnerable --include-transitive | tee vulnerable.txt

          # Suppress known advisories with no upstream fix available yet
          SUPPRESSED=(
            "GHSA-6c8g-7p36-r338"  # SharpCompress CVE-2026-44788 - no fix available as of 2026-05
          )

          FILTERED="$(cat vulnerable.txt)"
          for advisory in "${SUPPRESSED[@]}"; do
            FILTERED="$(echo "$FILTERED" | grep -v "$advisory")"
          done

          # Check for any remaining advisory URLs, not the project headers
          if echo "$FILTERED" | grep -qE "https://github.com/advisories/GHSA-"; then
            echo "Unsuppressed vulnerable packages detected:"
            echo "$FILTERED"
            exit 1
          fi

          echo "No unsuppressed vulnerabilities found."

      - name: Report outdated packages (informational)
        shell: bash
        run: dotnet list No2SQL.sln package --outdated --include-transitive | tee outdated.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack MCP NuGet artifacts
        run: dotnet pack No2SQL/No2SQL.csproj -c Release -o artifacts/pack

      - name: Verify packages contain no pdb files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in artifacts/pack/*.nupkg; do
            echo "Checking $pkg"
            if unzip -l "$pkg" | grep -Ei "\\.pdb$"; then
              echo "PDB file detected in $pkg"
              exit 1
            fi
          done

      - name: Verify MCP manifest and tool package layout
        shell: bash
        run: |
          set -euo pipefail
          MAIN_PKG="artifacts/pack/No2SQL.1.0.3.nupkg"
          echo "::group::Primary package layout"; unzip -l "$MAIN_PKG"; echo "::endgroup::"
          unzip -l "$MAIN_PKG" | grep -F ".mcp/server.json"
          # The folder under tools/ (tfm or "any") varies between SDK feature bands, so match loosely
          unzip -l "$MAIN_PKG" | grep -E "tools/.*/DotnetToolSettings\.xml$"
          # Primary package must be a dnx-runnable MCP server package
          unzip -p "$MAIN_PKG" No2SQL.nuspec | grep -F 'packageType name="DotnetTool"'
          unzip -p "$MAIN_PKG" No2SQL.nuspec | grep -F 'packageType name="McpServer"'
          # One self-contained RID package per supported platform
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            RID_PKG="artifacts/pack/No2SQL.$rid.1.0.3.nupkg"
            test -f "$RID_PKG"
            echo "::group::$rid package layout"; unzip -l "$RID_PKG"; echo "::endgroup::"
            unzip -l "$RID_PKG" | grep -E "tools/.*/$rid/No2SQL(\.exe)?$"
          done

      - name: Upload packed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: no2sql-packages
          path: artifacts/pack/*.nupkg