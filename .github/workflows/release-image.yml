name: Release Image

# Builds the multi-arch (linux/amd64, linux/arm64) container image for a v* tag, checks it with
# the container gate, pushes exactly the checked bytes to ghcr.io/ptalati015/no2sql:<version>
# (and :latest for a non-prerelease), and attests its build provenance. Needs no secret besides
# GITHUB_TOKEN. Only the publish job can write packages.
#
# - Push a v* tag: builds, checks and publishes that tag.
# - workflow_dispatch with a tag: rebuilds that existing tag and publishes it again.
# - workflow_dispatch without a tag: dry run on the selected ref; builds and checks the image,
#   keeps the OCI archive as a workflow artifact, pushes nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v1.2.0). Leave empty for a dry run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ptalati015/no2sql

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.gate.outputs.digest }}

    steps:
      - name: Resolve tag and mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then tag="$REF_NAME"; else tag="$INPUT_TAG"; fi

          if [[ -z "$tag" ]]; then
            echo "Dry run: building $SHA, nothing will be pushed."
            { echo "ref=$SHA"; echo "tag="; echo "publish=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not of the form vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi
          { echo "ref=refs/tags/$tag"; echo "tag=$tag"; echo "publish=true"; } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.mode.outputs.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches PackageVersion
        id: version
        shell: bash
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(dotnet msbuild No2SQL/No2SQL.csproj -getProperty:PackageVersion)"
          version="${version//[$'\r\n ']/}"
          if [[ -z "$version" ]]; then echo "Could not read PackageVersion."; exit 1; fi
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match PackageVersion $version (expected v$version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build image archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dotnet publish No2SQL/No2SQL.csproj -c Release -t:PublishContainer \
            -p:No2SqlContainer=true \
            -p:ContinuousIntegrationBuild=true \
            -p:ContainerArchiveOutputPath="$PWD/dist/no2sql-image.tar"

      - name: Container image gate
        id: gate
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/container_image_gate.py dist/no2sql-image.tar \
            --version "$VERSION" --min-runtime 10.0.15 --require-revision
          digest="sha256:$(skopeo inspect --raw "oci-archive:dist/no2sql-image.tar:$VERSION" | sha256sum | cut -d' ' -f1)"
          echo "Image index digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no2sql-image
          path: dist/no2sql-image.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: no2sql-image
          path: dist

      - name: Push the checked image to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          archive="dist/no2sql-image.tar"
          actual="sha256:$(skopeo inspect --raw "oci-archive:$archive:$VERSION" | sha256sum | cut -d' ' -f1)"
          if [[ "$actual" != "$DIGEST" ]]; then
            echo "Archive digest $actual is not the checked digest $DIGEST."
            exit 1
          fi

          # One login, written where both skopeo and the attest action read it.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          auth=(--authfile "$HOME/.docker/config.json")

          skopeo copy --all --preserve-digests "${auth[@]}" "oci-archive:$archive:$VERSION" "docker://$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            skopeo copy --all --preserve-digests "${auth[@]}" "oci-archive:$archive:$VERSION" "docker://$IMAGE:latest"
          fi

          pushed="sha256:$(skopeo inspect --raw "${auth[@]}" "docker://$IMAGE:$VERSION" | sha256sum | cut -d' ' -f1)"
          if [[ "$pushed" != "$DIGEST" ]]; then
            echo "GHCR has $pushed for $VERSION, expected $DIGEST."
            exit 1
          fi
          echo "Pushed $IMAGE:$VERSION@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Log out
        if: always()
        run: docker logout ghcr.io
