name: Release Zips

# Builds the self-contained single-file server for every supported RID and
# attaches No2SQL-<version>-<rid>.zip plus SHA256SUMS.txt to the GitHub Release
# for a v* tag. Does not push to NuGet and needs no secret besides GITHUB_TOKEN.
#
# - Push a v* tag: builds that tag and publishes the release.
# - workflow_dispatch with a tag: rebuilds that existing tag and publishes its release.
#   If the release already exists, the run fails unless overwrite is checked.
# - workflow_dispatch without a tag: dry run on the selected ref; the zips are
#   kept as a workflow artifact and nothing is published.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v1.1.0). Leave empty for a dry run.'
        required: false
        default: ''
      overwrite:
        description: 'Replace the assets of a release that already exists for this tag.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-zips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.mode.outputs.ref }}
      tag: ${{ steps.mode.outputs.tag }}
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve tag and mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi

          if [[ -z "$tag" ]]; then
            echo "Dry run: building $SHA, nothing will be published."
            {
              echo "ref=$SHA"
              echo "tag="
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not of the form vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi

          {
            echo "ref=refs/tags/$tag"
            echo "tag=$tag"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.mode.outputs.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches PackageVersion
        id: version
        shell: bash
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(dotnet msbuild No2SQL/No2SQL.csproj -getProperty:PackageVersion)"
          version="${version//[$'\r\n ']/}"
          if [[ -z "$version" ]]; then
            echo "Could not read PackageVersion from No2SQL/No2SQL.csproj."
            exit 1
          fi

          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match PackageVersion $version (expected v$version)."
            exit 1
          fi

          echo "PackageVersion: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
          - rid: win-arm64
            os: ubuntu-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          # macOS binaries are built on macOS so the SDK can ad-hoc sign the apphost.
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file exe
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dotnet publish No2SQL/No2SQL.csproj \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/publish/$RID"

      - name: Verify publish output is a single exe with no pdb files
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          dir="artifacts/publish/$RID"
          if [[ "$RID" == win-* ]]; then exe="No2SQL.exe"; else exe="No2SQL"; fi

          echo "Publish output for $RID:"
          ls -la "$dir"

          if find "$dir" -iname '*.pdb' | grep -q .; then
            echo "PDB file detected in $dir"
            exit 1
          fi

          if [[ ! -f "$dir/$exe" ]]; then
            echo "Expected $dir/$exe was not produced."
            exit 1
          fi

          # The zip ships only the exe, so anything else here would be missing at runtime.
          extra="$(find "$dir" -type f ! -name "$exe")"
          if [[ -n "$extra" ]]; then
            echo "Unexpected files next to the exe:"
            echo "$extra"
            exit 1
          fi

      - name: Upload exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Download exes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exe-*
          path: dist/exe

      - name: Build zips
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rids=(win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64)
          mkdir -p dist/zips dist/stage

          for rid in "${rids[@]}"; do
            if [[ "$rid" == win-* ]]; then exe="No2SQL.exe"; else exe="No2SQL"; fi
            stage="dist/stage/$rid"
            mkdir -p "$stage"

            cp "dist/exe/exe-$rid/$exe" "$stage/$exe"
            cp LICENSE NOTICE TRADEMARK.md "$stage/"

            # Artifact upload drops file modes, so restore the exec bit before zipping.
            chmod 0644 "$stage"/*
            if [[ "$rid" != win-* ]]; then chmod 0755 "$stage/$exe"; fi

            zip_path="$PWD/dist/zips/No2SQL-$VERSION-$rid.zip"
            (cd "$stage" && zip -X -9 "$zip_path" "$exe" LICENSE NOTICE TRADEMARK.md)
          done

      - name: Verify zip contents and exec bits
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for zip in dist/zips/*.zip; do
            count=$((count + 1))
            echo "== $zip"
            zipinfo "$zip"

            if [[ "$zip" == *-win-*.zip ]]; then exe="No2SQL.exe"; else exe="No2SQL"; fi

            expected="$(printf '%s\n' "$exe" LICENSE NOTICE TRADEMARK.md | sort)"
            actual="$(zipinfo -1 "$zip" | sort)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected entries in $zip:"
              echo "$actual"
              exit 1
            fi

            if [[ "$exe" == "No2SQL" ]] && ! zipinfo "$zip" "$exe" | grep -qE '^-rwx'; then
              echo "$exe in $zip is not executable."
              exit 1
            fi
          done

          if [[ "$count" -ne 6 ]]; then
            echo "Expected 6 zips, found $count."
            exit 1
          fi

      - name: Write and check SHA256SUMS.txt
        shell: bash
        working-directory: dist/zips
        run: |
          set -euo pipefail
          sha256sum No2SQL-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload zips as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: dist/zips/
          if-no-files-found: error
          retention-days: 7

      - name: Attest build provenance
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/zips/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          cd dist/zips
          sha256sum -c SHA256SUMS.txt

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [[ "$OVERWRITE" != "true" ]]; then
              echo "A release for $TAG already exists. Re-run with overwrite checked to replace its assets."
              exit 1
            fi
            gh release upload "$TAG" No2SQL-*.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" No2SQL-*.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "No2SQL $VERSION" \
              --generate-notes \
              "${prerelease[@]}"
          fi
